spring.application.name=supermercado

# =============================================================================
# CONEXIÓN A POSTGRESQL LOCAL (PLANTILLA EJEMPLO)
# =============================================================================
# Copia este archivo como 'application.properties' y ajusta tus credenciales
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pos_supermercado}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# CONFIGURACIÓN JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# INICIALIZACIÓN SQL (schema.sql / data.sql)
# =============================================================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR
# =============================================================================
server.port=8080
